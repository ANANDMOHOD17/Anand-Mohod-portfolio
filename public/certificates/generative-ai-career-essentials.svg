<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 38px; fill: #111827; text-anchor: middle; }
      .recipient-lead { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #4b5563; text-anchor: middle; }
      .recipient-name { font-weight: 700; fill: #111827; }
      .time-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #4b5563; text-anchor: middle; }
      .skills-header { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 16px; fill: #1f2937; text-anchor: middle; }
      .pill-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #374151; text-anchor: middle; }
      .signer-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #4b5563; text-anchor: middle; }
      .cert-id-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #6b7280; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="1200" height="840" fill="#99b2b7" />
  
  <!-- Inner White Card -->
  <rect x="40" y="40" width="1120" height="760" fill="#ffffff" rx="4" />

  <!-- Top Header Section: LinkedIn Learning + Microsoft Logo -->
  <g transform="translate(260, 110)">
    <!-- LinkedIn Learning Logo -->
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#0077b5">Linked</text>
    <rect x="92" y="3" width="28" height="26" rx="4" fill="#0077b5" />
    <text x="98" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#ffffff">in</text>
    <text x="130" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="300" font-size="28" fill="#0077b5">Learning</text>
    
    <!-- Microsoft Logo -->
    <g transform="translate(390, 2)">
      <!-- 4 Squares -->
      <rect x="0" y="0" width="12" height="12" fill="#f25022" />
      <rect x="15" y="0" width="12" height="12" fill="#7fba00" />
      <rect x="0" y="15" width="12" height="12" fill="#00a4ef" />
      <rect x="15" y="15" width="12" height="12" fill="#ffb900" />
      <text x="38" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="28" fill="#505050">Microsoft</text>
    </g>
  </g>

  <!-- Certificate Main Title -->
  <text x="600" y="260" class="main-title">Career Essentials in Generative AI by</text>
  <text x="600" y="310" class="main-title">Microsoft and LinkedIn</text>

  <!-- Recipient Info -->
  <text x="600" y="390" class="recipient-lead">
    Learning Path completed by <tspan class="recipient-name">ANAND MOHOD</tspan>
  </text>
  <text x="600" y="425" class="time-text">Sep 08, 2026 at 11:06AM UTC • 4 hours 18 minutes</text>

  <!-- Top Skills Covered -->
  <text x="600" y="490" class="skills-header">Top skills covered</text>

  <!-- Skill Badges/Pills -->
  <g transform="translate(600, 520)">
    <!-- Pill 1: Microsoft Copilot -->
    <rect x="-245" y="0" width="150" height="34" rx="17" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="-170" y="22" class="pill-text">Microsoft Copilot</text>

    <!-- Pill 2: Generative AI -->
    <rect x="-75" y="0" width="140" height="34" rx="17" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="-5" y="22" class="pill-text">Generative AI</text>

    <!-- Pill 3: Responsible AI -->
    <rect x="85" y="0" width="150" height="34" rx="17" fill="none" stroke="#9ca3af" stroke-width="1.5" />
    <text x="160" y="22" class="pill-text">Responsible AI</text>
  </g>

  <!-- Signature Section -->
  <g transform="translate(600, 610)">
    <path d="M -80 20 Q -60 -15, -45 15 T -15 -5 Q 0 25, 20 0 T 50 15 Q 70 -5, 90 8" 
          fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" />
    <path d="M -50 25 C -20 5, 10 35, 40 10 C 60 20, 80 -5, 100 12" 
          fill="none" stroke="#1f2937" stroke-width="1.8" stroke-linecap="round" />
    <text x="0" y="55" class="signer-text">Shea Hanson, Head of Learning Content Strategy</text>
  </g>

  <!-- Badge Emblem Bottom Right -->
  <g transform="translate(1010, 680)">
    <circle cx="0" cy="0" r="46" fill="#305669" />
    <circle cx="0" cy="0" r="41" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" />
    <rect x="-16" y="-16" width="32" height="32" rx="5" fill="#0077b5" />
    <text x="-10" y="8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#ffffff">in</text>
    <text x="0" y="-28" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="2">LEARNING PATH</text>
    <text x="0" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="7" fill="#ffffff" font-weight="700" text-anchor="middle" letter-spacing="2">COMPLETION</text>
  </g>

  <!-- Footer Certificate ID -->
  <text x="600" y="760" class="cert-id-text">Certificate ID: 208a820d17122c0da95efcf1d36da34f1c5a8fbc1bf56deb040d487f3b41b3ec</text>
</svg>
