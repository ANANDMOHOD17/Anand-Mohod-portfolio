<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <style>
      .award-lead { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 26px; fill: #111827; }
      .name-large { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 50px; fill: #111827; letter-spacing: 0.5px; }
      .satisfied-lead { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #374151; }
      .title-course { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 40px; fill: #111827; }
      .meta-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #374151; }
      .verify-link { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #4b5563; }
    </style>
    <linearGradient id="careerBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Blue Outer Border Background -->
  <rect width="1200" height="840" fill="#1b365d" />
  
  <!-- Inner White Card -->
  <rect x="45" y="45" width="1110" height="750" fill="#ffffff" />

  <!-- Top Left Header Lead -->
  <text x="90" y="125" class="award-lead">In recognition of the commitment to achieve</text>
  <text x="90" y="160" class="award-lead">professional excellence</text>

  <!-- Top Right IBM Badge representation -->
  <g transform="translate(930, 90)">
    <rect width="170" height="125" rx="3" fill="url(#careerBadgeGrad)" />
    <rect width="170" height="75" rx="3" fill="#ccfbf1" opacity="0.95" />
    <text x="12" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#064e3b">Career Management</text>
    <text x="12" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#064e3b">Essentials</text>
    <text x="12" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#0f766e">IBM SkillsBuild</text>
    <!-- IBM logo -->
    <text x="120" y="112" font-family="'Segoe UI', Roboto, monospace" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">IBM</text>
  </g>

  <!-- Recipient Name -->
  <text x="90" y="330" class="name-large">ANAND MOHOD</text>

  <!-- Satisfaction Text -->
  <text x="90" y="420" class="satisfied-lead">Has successfully satisfied the requirements for:</text>

  <!-- Course Title -->
  <text x="90" y="520" class="title-course">Career Management Essentials</text>

  <!-- Bottom Divider Line -->
  <line x1="90" y1="580" x2="1080" y2="580" stroke="#e5e7eb" stroke-width="1.5" />

  <!-- QR Code Minimal Representation -->
  <g transform="translate(90, 625)">
    <rect width="64" height="64" fill="none" stroke="#111827" stroke-width="2" />
    <rect x="8" y="8" width="18" height="18" fill="#111827" />
    <rect x="38" y="8" width="18" height="18" fill="#111827" />
    <rect x="8" y="38" width="18" height="18" fill="#111827" />
    <rect x="34" y="34" width="8" height="8" fill="#111827" />
    <rect x="46" y="46" width="10" height="10" fill="#111827" />
  </g>

  <!-- Issue Metadata -->
  <g transform="translate(170, 642)">
    <text x="0" y="0" class="meta-label">Issued on: Sep 01, 2026</text>
    <text x="0" y="24" class="meta-label">Issued by: IBM SkillsBuild</text>
  </g>

  <!-- Credly Verify URL -->
  <text x="170" y="715" class="verify-link">Verify: https://www.credly.com/badges/02b94d6b-ea65-4504-bec5-64235fdbe2fa</text>

  <!-- IBM 8-Bar Logo Bottom Right -->
  <g transform="translate(945, 665)">
    <text x="0" y="35" font-family="'Courier New', monospace" font-size="52" font-weight="900" fill="#0f62fe" letter-spacing="3">IBM</text>
  </g>
</svg>
