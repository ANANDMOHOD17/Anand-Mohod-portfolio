<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <style>
      .main-heading { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 300; font-size: 26px; fill: #1e3a8a; letter-spacing: 4px; text-anchor: middle; }
      .completion-heading { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #1e3a8a; letter-spacing: 2px; text-anchor: middle; }
      .recipient-name { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #111827; text-anchor: middle; letter-spacing: 1px; }
      .lead-statement { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #4b5563; text-anchor: middle; }
      .course-name { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 32px; fill: #111827; text-anchor: middle; }
      .praise-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 17px; fill: #4b5563; text-anchor: middle; font-style: italic; }
      .meta-footer { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 16px; fill: #1f2937; }
      .disclaimer { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 10px; fill: #6b7280; text-anchor: middle; }
      .signer-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 15px; fill: #1f2937; text-anchor: end; }
      .signer-role { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #6b7280; text-anchor: end; }
    </style>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1200" height="840" fill="#ffffff" />
  
  <!-- Outer Subtle Frame -->
  <rect x="25" y="25" width="1150" height="790" fill="none" stroke="#e2e8f0" stroke-width="2" />
  <rect x="35" y="35" width="1130" height="770" fill="none" stroke="#f1f5f9" stroke-width="1" />

  <!-- Top Left: Google Cloud Logo -->
  <g transform="translate(60, 80)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" font-weight="600">Powered by</text>
    <g transform="translate(0, 10)">
      <!-- Google Cloud Logo Graphic -->
      <path d="M 12 20 C 12 12, 18 6, 26 6 C 31 6, 36 9, 38 13 C 41 10, 46 8, 51 8 C 60 8, 68 15, 68 24 C 73 25, 77 30, 77 35 C 77 41, 72 46, 66 46 L 14 46 C 6 46, 0 40, 0 32 C 0 25, 5 20, 12 20 Z" fill="#4285f4" opacity="0.9" />
      <path d="M 26 6 C 31 6, 36 9, 38 13 C 41 10, 46 8, 51 8 C 54 8, 57 9, 60 11 L 46 25 L 30 18 Z" fill="#ea4335" />
      <path d="M 68 24 C 73 25, 77 30, 77 35 C 77 41, 72 46, 66 46 L 46 46 L 50 30 Z" fill="#34a853" />
      <path d="M 0 32 C 0 25, 5 20, 12 20 L 25 35 L 14 46 Z" fill="#fbbc05" />
      
      <!-- Text: Google Cloud -->
      <text x="90" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#475569">Google Cloud</text>
    </g>
  </g>

  <!-- Top Right: Simplilearn SkillUP Logo -->
  <g transform="translate(790, 90)">
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" fill="#f97316">simpli</text>
    <text x="80" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="28" fill="#0284c7">learn</text>
    <line x1="160" y1="4" x2="160" y2="28" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="175" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#0284c7">Skill<tspan fill="#f97316">UP</tspan></text>
  </g>

  <!-- Title Section -->
  <text x="600" y="260" class="main-heading">DECLARATION OF</text>
  <text x="600" y="315" class="completion-heading">COMPLETION</text>

  <!-- Recipient Name -->
  <text x="600" y="415" class="recipient-name">ANAND MOHOD</text>
  
  <!-- Underline under name -->
  <line x1="250" y1="445" x2="950" y2="445" stroke="#94a3b8" stroke-dasharray="2 2" stroke-width="1.5" />

  <!-- Completion Statement -->
  <text x="600" y="500" class="lead-statement">has successfully completed the online course:</text>

  <!-- Course Title -->
  <text x="600" y="555" class="course-name">Introduction to Generative AI Studio</text>

  <!-- Commendation -->
  <text x="600" y="620" class="praise-text">This professional has demonstrated initiative and a commitment to</text>
  <text x="600" y="645" class="praise-text">deepening their skills and advancing their career. Well done!</text>

  <!-- Footer Info Left: Date & Code -->
  <g transform="translate(90, 715)">
    <text x="0" y="0" class="meta-footer">3rd September 2026</text>
    <text x="0" y="25" class="meta-footer" font-weight="400" fill="#475569">Certificate code : <tspan font-weight="600" fill="#111827">10687373</tspan></text>
  </g>

  <!-- Footer Info Right: Signature -->
  <g transform="translate(1110, 680)">
    <!-- Signature Graphic -->
    <path d="M -90 15 Q -75 -10, -60 20 T -40 0 Q -25 25, -10 5 T 10 15" 
          fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="45" class="signer-text">Krishna Kumar</text>
    <text x="0" y="65" class="signer-role">CEO, Simplilearn</text>
  </g>

  <!-- Bottom Legal Note -->
  <text x="600" y="785" class="disclaimer">This certification is issued solely for the purpose of acknowledging completion of Google Cloud Courses on the Simplilearn portal and is not an official Google Cloud Certification.</text>
</svg>
