<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <style>
      .deloitte-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 54px; fill: #000000; letter-spacing: -0.5px; }
      .name-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #111827; letter-spacing: 0.5px; text-transform: uppercase; }
      .course-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: #1f2937; letter-spacing: -0.5px; }
      .subtitle-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 30px; fill: #4b5563; }
      .date-text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 22px; fill: #4b5563; }
      .body-header { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #374151; }
      .body-item { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #4b5563; }
      .signer-name { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #111827; }
      .signer-role { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #4b5563; line-height: 1.3; }
      .verification-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #9ca3af; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="840" fill="#ffffff" />
  
  <!-- Outer Subtle Border -->
  <rect x="2" y="2" width="1196" height="836" fill="none" stroke="#e5e7eb" stroke-width="2" />

  <!-- Deloitte Logo -->
  <g transform="translate(85, 115)">
    <text x="0" y="0" class="deloitte-title">Deloitte</text>
    <circle cx="218" cy="-8" r="7.5" fill="#86BC25" />
  </g>

  <!-- Recipient Name -->
  <text x="85" y="220" class="name-text">ANAND MOHOD</text>

  <!-- Program Name -->
  <text x="85" y="285" class="course-text">Data Analytics Job Simulation</text>

  <!-- Certificate Subtitle -->
  <text x="85" y="345" class="subtitle-text">Certificate of Completion</text>

  <!-- Issue Date -->
  <text x="85" y="390" class="date-text">August 22nd, 2026</text>

  <!-- Divider Line -->
  <line x1="85" y1="465" x2="1115" y2="465" stroke="#eceff1" stroke-width="1.5" />

  <!-- Practical Tasks Section -->
  <g transform="translate(85, 510)">
    <text x="0" y="0" class="body-header">Over the period of August 2026, ANAND MOHOD has completed practical tasks in:</text>
    <text x="0" y="38" class="body-item">Data analysis</text>
    <text x="0" y="65" class="body-item">Forensic technology</text>
  </g>

  <!-- Signatory Section -->
  <g transform="translate(820, 500)">
    <!-- Handwritten Signature representation -->
    <path d="M 10 38 Q 30 15, 45 42 T 75 25 Q 90 48, 105 30 T 130 45 Q 145 28, 160 38 T 180 32" 
          fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 35 48 C 65 30, 95 62, 125 35 C 145 45, 165 20, 195 40" 
          fill="none" stroke="#1e293b" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 5 28 L 35 26" 
          fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
          
    <text x="0" y="90" class="signer-name">Tina McCreery</text>
    <text x="0" y="112" class="signer-role">Chief Human</text>
    <text x="0" y="132" class="signer-role">Resources Officer,</text>
    <text x="0" y="152" class="signer-role">Deloitte</text>
  </g>

  <!-- Bottom Verification Footer -->
  <line x1="85" y1="745" x2="1115" y2="745" stroke="#f3f4f6" stroke-width="1" />
  <text x="85" y="775" class="verification-text">Enrolment Verification Code 6a89f243841fdedde7ed5a58   |   User Verification Code 6a3ec42aa27deb0c56440189   |   Issued by Forage</text>
</svg>
