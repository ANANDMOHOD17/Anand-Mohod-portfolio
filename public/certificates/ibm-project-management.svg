<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <style>
      .course-hero-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #111827; text-anchor: middle; letter-spacing: -0.5px; }
      .issued-to-label { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14px; fill: #6b7280; text-anchor: middle; letter-spacing: 2px; }
      .recipient-hero-name { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 38px; fill: #111827; text-anchor: middle; letter-spacing: 0.5px; }
      .footer-meta { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #374151; text-anchor: middle; }
      .verify-sublink { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 13.5px; fill: #1f2937; text-anchor: middle; }
    </style>
    <linearGradient id="pmBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
  </defs>

  <!-- Clean Canvas -->
  <rect width="1200" height="840" fill="#ffffff" />
  
  <!-- Outer Frame Border -->
  <rect x="35" y="35" width="1130" height="770" fill="none" stroke="#e5e7eb" stroke-width="2" />

  <!-- Top Right Circular IBM SkillsBuild Logo -->
  <g transform="translate(970, 75)">
    <circle cx="65" cy="65" r="65" fill="#1b65a4" />
    <circle cx="65" cy="65" r="54" fill="#ffffff" />
    <text x="65" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1b65a4" text-anchor="middle">IBM SkillsBuild</text>
  </g>

  <!-- Bottom Left Geometric Accent Triangle -->
  <polygon points="35,660 35,805 180,805" fill="#2d68c4" />
  
  <!-- Bottom Right Accent Triangle -->
  <polygon points="1020,805 1165,805 1165,660" fill="#2d68c4" opacity="0.9" />

  <!-- Course Title -->
  <text x="600" y="315" class="course-hero-title">Project Management Fundamentals</text>

  <!-- Issued To Label -->
  <text x="600" y="380" class="issued-to-label">ISSUED TO</text>

  <!-- Recipient Name -->
  <text x="600" y="435" class="recipient-hero-name">ANAND MOHOD</text>

  <!-- Central Badge Graphic -->
  <g transform="translate(515, 475)">
    <rect width="170" height="150" rx="4" fill="url(#pmBadgeGrad)" />
    <rect width="170" height="85" rx="4" fill="#fdf2f8" opacity="0.96" />
    <text x="12" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#831843">Project Management</text>
    <text x="12" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#831843">Fundamentals</text>
    <text x="12" y="66" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#be185d">IBM SkillsBuild</text>
    <!-- Project nodes icon in badge bottom -->
    <circle cx="35" cy="120" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="65" cy="110" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="55" cy="135" r="6" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <line x1="41" y1="118" x2="59" y2="112" stroke="#ffffff" stroke-width="1.5" />
    <line x1="39" y1="124" x2="50" y2="131" stroke="#ffffff" stroke-width="1.5" />
    <text x="120" y="132" font-family="'Segoe UI', Roboto, monospace" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="1">IBM</text>
  </g>

  <!-- Footer Issue & Verification Text -->
  <text x="600" y="695" class="footer-meta">Issued on: 01 SEP 2026 | Issued by: IBM SkillsBuild</text>
  <text x="600" y="725" class="verify-sublink">Verify: https://www.credly.com/go/8I8vK281</text>
</svg>
